
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozetka Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <a class="logo" href="">
            Rozetka shop
        </a>

        <div class="header-buttons">

           <button class="cart-btn" id="cartBtn">
        🛒
    </button>

    <button class="burger" id="burger">
        <img class="Image" src="./1374128.png" alt="">
    </button>

        </div>

    </header>


    <div class="filters" id="filters">

        <h2>Фильтры</h2>

        <select id="category">
            <option value="all">
                Все категории
            </option>
        </select>

        <input
            type="text"
            id="search"
            placeholder="Название товара"
        >

        <input
            type="number"
            id="price"
            placeholder="Максимальная цена"
        >

        <div class="sort-buttons">

            <button id="sortUp">
                Цена ↑
            </button>

            <button id="sortDown">
                Цена ↓
            </button>

        </div>

    </div>


    <div class="cart" id="cart">

        <h2>
            Корзина
        </h2>

        <div id="cartItems"></div>

        <p>
            Итого:
            <span id="cartTotal">0</span>$
        </p>
       <a class="Order" href="order.html">Оформить заказ прямо сейчяс!</a>
        <button id="closeCart">
            Закрыть
        </button>

    </div>
    <div class="header-buttons">

    
</div>


    <div class="Product_box"></div>


    <script src="./js.js"></script>

</body>
</html>

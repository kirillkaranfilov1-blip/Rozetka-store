
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <link rel="stylesheet" href="order.css">
</head>
<body>

    <div class="order-box">
        <h1>Оформление заказа</h1>

        <form id="orderForm">

            <input id="name" type="text" placeholder="Ваше имя" required>

            <input id="surname" type="text" placeholder="Фамилия" required>

            <input id="phone" type="tel" placeholder="Номер телефона" required>

            <input id="email" type="email" placeholder="Email" required>

            <select id="post" required>
                <option value="">Выберите службу доставки</option>
                <option value="Новая почта">Новая почта</option>
            </select>

            <select id="city" required>
                <option value="">Выберите город</option>
                <option value="Одесса">Одесса</option>
                <option value="Киев">Киев</option>
                <option value="Львов">Львов</option>
                <option value="Днепр">Днепр</option>
                <option value="Харьков">Харьков</option>
            </select>

            <select id="department" required>
                <option value="">Выберите отделение</option>
            </select>

            <select id="payment" required>
                <option value="">Способ оплаты</option>
                <option value="Банковская карта">Банковская карта</option>
                <option value="При получении">При получении</option>
            </select>

            <textarea id="comment" placeholder="Комментарий к заказу"></textarea>

            <button type="submit">Подтвердить заказ</button>

        </form>
        <a class="back" href="index.html">← Вернуться в магазин</a>
    </div>
    <script src="order.js"></script>
</body>
</html>
